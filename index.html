<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Gym Log</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
  <h1>MY GYM LOG</h1>
  <p>Allenamento • carichi • ripetizioni • timer</p>
</header>

<main>

<div class="tabs">
  <button id="tabA" onclick="openDay('A')">GIORNO A</button>
  <button id="tabB" onclick="openDay('B')">GIORNO B</button>
  <button id="tabC" onclick="openDay('C')">GIORNO C</button>
</div>

<div id="content"></div>

</main>


<div style="
position:fixed;
bottom:78px;
left:50%;
transform:translateX(-50%);
width:calc(100% - 30px);
max-width:690px;
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
z-index:50;
">
<button id="navHistory" onclick="showHistory()" style="
padding:13px;
border-radius:13px;
border:1px solid #2a3241;
background:#151922;
color:white;
font-weight:800;
">STORICO</button>

<button id="navProgress" onclick="showProgress()" style="
padding:13px;
border-radius:13px;
border:1px solid #2a3241;
background:#151922;
color:white;
font-weight:800;
">PROGRESSI</button>
</div>

<button class="save" onclick="saveWorkout()">
SALVA ALLENAMENTO
</button>


<div id="timer">
  <small>RECUPERO</small>
  <strong id="timerText">1:30</strong>
</div>

<div id="toast"></div>

<script src="js/app.js"></script>

</body>
</html>

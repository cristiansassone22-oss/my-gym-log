<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Gym Log</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>


<body>

<header>
  <h1>MY GYM LOG</h1>
  <p>Allenamento • carichi • ripetizioni • timer</p>
</header>

<main>

<div class="tabs">
  <button id="tabA" onclick="openDay('A')">GIORNO A</button>
  <button id="tabB" onclick="openDay('B')">GIORNO B</button>
  <button id="tabC" onclick="openDay('C')">GIORNO C</button>
</div>

<div id="content"></div>

</main>


<nav class="mobileNav">
  <button id="mobileScheda" class="active" onclick="openDay(currentDay)">
    <span>🏋️</span>
    Scheda
  </button>

  <button id="mobileHistory" onclick="showHistory()">
    <span>🕘</span>
    Storico
  </button>

  <button id="mobileProgress" onclick="showProgress()">
    <span>📈</span>
    Progressi
  </button>

  <button id="mobileNutrition" onclick="showNutrition()">
    <span>🍽️</span>
    Nutrizione
  </button>

  <button id="mobileMore" onclick="showMoreMenu()">
    <span>•••</span>
    Altro
  </button>
</nav>

<button class="save" onclick="saveWorkout()">
SALVA ALLENAMENTO
</button>


<div id="timer">
  <small>RECUPERO</small>
  <strong id="timerText">1:30</strong>
</div>

<div id="toast"></div>

<script src="js/app.js"></script>

</body>
</html>
